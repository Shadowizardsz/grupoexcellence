<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grupo Excellence</title>
<meta name="description" content="Soluções, Contabilidade, Assessoria e Consultoria. Fale com o Grupo Excellence.">
<link rel="icon" href="assets/logo-g-excellence.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black-core:#050505;
    --black-deep:#000000;
    --graphite:#161616;
    --brown-shadow:#1B1209;
    --gold-primary:#D7A33A;
    --gold-strong:#E6A321;
    --gold-light:#F7D477;
    --warm-white:#F5F3EE;
    --soft-gray:#D3D0C9;
    --gold-gradient: linear-gradient(90deg, #F6D77A 0%, #E0AE45 48%, #C98716 100%);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    min-height:100%;
    background: var(--black-deep);
  }

  body{
    font-family:'Inter', -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--warm-white);
    background:
      radial-gradient(circle at 50% -10%, rgba(230,163,33,0.10) 0%, rgba(0,0,0,0) 45%),
      linear-gradient(165deg, #000000 0%, #0a0a0a 30%, #161616 55%, #1B1209 82%, #000000 100%);
    background-attachment: fixed;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 48px 20px 40px;
  }

  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .bg-decor{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }

  .ledger-grid{
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(to bottom, rgba(215,163,58,0.09) 0, rgba(215,163,58,0.09) 1px, transparent 1px, transparent 44px),
      repeating-linear-gradient(to right, rgba(215,163,58,0.065) 0, rgba(215,163,58,0.065) 1px, transparent 1px, transparent 88px);
  }

  .bg-decor svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .bg-chart polyline{ fill:none; stroke: var(--gold-primary); stroke-width:1.6; opacity:.22; }
  .bg-chart circle{ fill: var(--gold-primary); opacity:.30; }

  .corner-mark{
    position:fixed;
    width:22px;
    height:22px;
    border-color: rgba(215,163,58,0.42);
    pointer-events:none;
    z-index:1;
  }
  .corner-mark.tl{ top:16px; left:16px; border-top:1px solid; border-left:1px solid; }
  .corner-mark.br{ bottom:16px; right:16px; border-bottom:1px solid; border-right:1px solid; }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom: 28px;
    animation: fadeIn .7s ease both;
  }

  .brand img{
    width: 96px;
    height:auto;
    display:block;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.55));
  }

  .brand .name{
    margin-top:16px;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:.04em;
    text-transform:uppercase;
    line-height:1.15;
  }

  .brand .name .grupo{ color: var(--warm-white); }
  .brand .name .excellence{ color: var(--gold-primary); }

  .brand .tagline{
    margin-top:14px;
    font-family:'Inter', sans-serif;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color: var(--soft-gray);
  }

  .divider{
    width:56px;
    height:2px;
    margin: 18px 0 26px;
    background: var(--gold-gradient);
    border-radius: 2px;
    animation: fadeIn .8s ease .1s both;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.00)), var(--graphite);
    border:1px solid rgba(215,163,58,0.35);
    border-radius:12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    text-decoration:none;
    color: var(--warm-white);
    cursor:pointer;
    font-family:'Inter', sans-serif;
    text-align:left;
    animation: fadeIn .6s ease both;
    transition: border-color .2s ease, transform .15s ease, background .2s ease, box-shadow .2s ease;
  }

  .link-btn:nth-child(1){ animation-delay:.05s; }
  .link-btn:nth-child(2){ animation-delay:.1s; }
  .link-btn:nth-child(3){ animation-delay:.15s; }
  .link-btn:nth-child(4){ animation-delay:.2s; }
  .link-btn:nth-child(5){ animation-delay:.25s; }

  .link-btn:hover, .link-btn:focus-visible{
    border-color: var(--gold-strong);
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(0,0,0,0.45);
  }

  .link-btn:active{ transform: translateY(0); }

  .link-icon{
    flex:0 0 auto;
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background: rgba(215,163,58,0.08);
    border:1px solid rgba(215,163,58,0.30);
  }

  .link-icon svg{
    width:19px;
    height:19px;
    stroke: var(--gold-light);
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .link-text{ flex:1 1 auto; min-width:0; }

  .link-title{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color: var(--warm-white);
  }

  .link-sub{
    margin-top:3px;
    font-size:12.5px;
    color: var(--soft-gray);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .link-arrow{
    flex:0 0 auto;
    width:16px;
    height:16px;
    stroke: var(--gold-primary);
    fill:none;
    stroke-width:1.8;
    opacity:.85;
  }

  .footer{
    margin-top:34px;
    text-align:center;
    animation: fadeIn .8s ease .3s both;
  }

  .footer p{
    font-size:11px;
    color: var(--soft-gray);
    opacity:.75;
    letter-spacing:.04em;
  }

  .footer strong{ color: var(--gold-primary); font-weight:600; }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--graphite);
    border:1px solid var(--gold-primary);
    color: var(--warm-white);
    font-family:'Inter', sans-serif;
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    white-space:nowrap;
  }

  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (max-width:360px){
    .brand img{ width:140px; }
  }
</style>
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <div class="ledger-grid"></div>
  <svg class="bg-chart" viewBox="0 0 440 900" preserveAspectRatio="none">
    <polyline points="-20,780 60,730 130,752 200,668 270,690 330,586 380,612 470,470"/>
    <circle cx="200" cy="668" r="3.5"/>
    <circle cx="330" cy="586" r="3.5"/>
    <circle cx="470" cy="470" r="3.5"/>

</div>
<div class="corner-mark tl"></div>
<div class="corner-mark br"></div>

<div class="page">

  <div class="brand">
    <img src="assets/logo-g-excellence.png" alt="Grupo Excellence">
    <div class="name"><span class="grupo">Grupo</span> <span class="excellence">Excellence</span></div>
    <div class="tagline">Soluções · Contabilidade · Assessoria · Consultoria</div>
  </div>

  <div class="divider"></div>

  <div class="links">

    <!-- PIX -->
    <button type="button" class="link-btn" id="pix-btn" data-pix="+5598970258803">
      <span class="link-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M7.5 7.5l2.5 2.5M14 14l2.5 2.5M16.5 7.5L14 10M10 14l-2.5 2.5"/></svg>
      </span>
      <span class="link-text">
        <span class="link-title">Chave Pix</span>
        <span class="link-sub">(98) 97025-8803 · toque para copiar</span>
      </span>
      <svg class="link-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>

    <!-- INSTAGRAM -->
    <a class="link-btn" href="https://www.instagram.com/grup.excellence?stkn=MWhiejZwdnM0Y3VydA==" target="_blank" rel="noopener">
      <span class="link-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none" style="fill:#F7D477"/></svg>
      </span>
      <span class="link-text">
        <span class="link-title">Instagram</span>
        <span class="link-sub">@grup.excellence</span>
      </span>
      <svg class="link-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <!-- AVALIAÇÃO GOOGLE -->
    <a class="link-btn" href="https://search.google.com/local/writereview?placeid=ChIJ_dZsQVRJspIRMJ3gv90kCuU" target="_blank" rel="noopener">
      <span class="link-icon">
        <svg viewBox="0 0 24 24"><path d="M12 17.3l-5.4 3 1.4-6-4.6-4h6l2.6-6 2.6 6h6l-4.6 4 1.4 6z"/></svg>
      </span>
      <span class="link-text">
        <span class="link-title">Avalie no Google</span>
        <span class="link-sub">Deixe sua avaliação</span>
      </span>
      <svg class="link-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <!-- WHATSAPP -->
    <a class="link-btn" href="https://wa.me/5598970258803?text=Ol%C3%A1%2C%20vim%20pelo%20link%20do%20Grupo%20Excellence" target="_blank" rel="noopener">
      <!-- Assumido o mesmo número informado como chave Pix; troque o número em wa.me/ se for diferente -->
      <span class="link-icon">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3.6-6.7"/><path d="M20 12a8 8 0 0 0-8-8"/><path d="M8 10.5c.3 2.4 2.3 4.4 4.7 4.7"/><path d="M4 20l1.3-3.6A8 8 0 1 1 8.6 19L4 20z" fill="#0a0a0a" stroke="none"/><path d="M4 20l1.3-3.6A8 8 0 1 1 8.6 19L4 20z"/></svg>
      </span>
      <span class="link-text">
        <span class="link-title">WhatsApp</span>
        <span class="link-sub">(98) 97025-8803</span>
      </span>
      <svg class="link-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>

  </div>

  <div class="footer">
    <p><strong>Grupo Excellence</strong> © 2026 · Todos os direitos reservados</p>
  </div>

</div>

<div class="toast" id="toast">Chave Pix copiada!</div>

<script>
  const pixBtn = document.getElementById('pix-btn');
  const toast = document.getElementById('toast');
  let toastTimer;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  pixBtn.addEventListener('click', async () => {
    const key = pixBtn.getAttribute('data-pix');
    try{
      await navigator.clipboard.writeText(key);
      showToast('Chave Pix copiada!');
    }catch(err){
      showToast('Chave Pix: ' + key);
    }
  });
</script>

</body>
</html>
