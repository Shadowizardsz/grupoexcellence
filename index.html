<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grupo Excellence</title>
<meta name="description" content="Soluções, Contabilidade, Assessoria e Consultoria. Fale com o Grupo Excellence.">
<link rel="icon" href="assets/logo-g-excellence.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black-core:#050505;
    --black-deep:#000000;
    --graphite:#161616;
    --brown-shadow:#1B1209;
    --gold-primary:#D7A33A;
    --gold-strong:#E6A321;
    --gold-light:#F7D477;
    --warm-white:#F5F3EE;
    --soft-gray:#D3D0C9;
    --gold-gradient: linear-gradient(90deg, #F6D77A 0%, #E0AE45 48%, #C98716 100%);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    min-height:100%;
    background: var(--black-deep);
  }

  body{
    font-family:'Inter', -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--warm-white);
    background:
      radial-gradient(circle at 50% -10%, rgba(230,163,33,0.10) 0%, rgba(0,0,0,0) 45%),
      linear-gradient(165deg, #000000 0%, #0a0a0a 30%, #161616 55%, #1B1209 82%, #000000 100%);
    background-attachment: fixed;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 48px 20px 40px;
  }

  .page{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom: 28px;
    animation: fadeIn .7s ease both;
  }

  .brand img{
    width: 96px;
    height:auto;
    display:block;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.55));
  }

  .brand .name{
    margin-top:16px;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:.04em;
    text-transform:uppercase;
    line-height:1.15;
  }

  .brand .name .grupo{ color: var(--warm-white); }
  .brand .name .excellence{ color: var(--gold-primary); }

  .brand .tagline{
    margin-top:14px;
    font-family:'Inter', sans-serif;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color: var(--soft-gray);
  }

  .divider{
    width:56px;
    height:2px;
    margin: 18px 0 26px;
    background: var(--gold-gradient);
    border-radius: 2px;
    animation: fadeIn .8s ease .1s both;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.00)), var(--graphite);
    border:1px solid rgba(215,163,58,0.35);
    border-radius:12px;
    text-decoration:none;
    color: var(--warm-white);
    cursor:pointer;
    font-family:'Inter', sans-serif;
    text-align:left;
    animation: fadeIn .6s ease both;
    transition: border-color .2s ease, transform .15s ease, background .2s ease;
  }

  .link-btn:nth-child(1){ animation-delay:.05s; }
  .link-btn:nth-child(2){ animation-delay:.1s; }
  .link-btn:nth-child(3){ animation-delay:.15s; }
  .link-btn:nth-child(4){ animation-delay:.2s; }
  .link-btn:nth-child(5){ animation-delay:.25s; }

  .link-btn:hover, .link-btn:focus-visible{
    border-color: var(--gold-strong);
    transform: translateY(-2px);
  }

  .link-btn:active{ transform: translateY(0); }

  .link-icon{
    flex:0 0 auto;
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background: rgba(215,163,58,0.08);
    border:1px solid rgba(215,163,58,0.30);
  }

  .link-icon svg{
    width:19px;
    height:19px;
    stroke: var(--gold-light);
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .link-text{ flex:1 1 auto; min-width:0; }

  .link-title{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color: var(--warm-white);
  }

  .link-sub{
    margin-top:3px;
    font-size:12.5px;
    color: var(--soft-gray);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .link-arrow{
    flex:0 0 auto;
    width:16px;
    height:16px;
    stroke: var(--gold-primary);
    fill:none;
    stroke-width:1.8;
    opacity:.85;
  }

  .footer{
    margin-top:34px;
    text-align:center;
    animation: fadeIn .8s ease .3s both;
  }

  .footer p{
    font-size:11px;
    color: var(--soft-gray);
    opacity:.75;
    letter-spacing:.04em;
  }

  .footer strong{ color: var(--gold-primary); font-weight:600; }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--graphite);
    border:1px solid var(--gold-primary);
    color: var(--warm-white);
    font-family:'Inter', sans-serif;
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    white-space:nowrap;
  }

  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (max-width:360px){
    .brand img{ width:140px; }
  }
</style>
</head>
<body>

<div class="page">

    <div class="name"><span class="grupo">Grupo</span> <span class="excellence">Excellence</span></div>

    <!-- AVALIAÇÃO GOOGLE -->

    <a class="link-btn" href="https://seusite.com.br" target="_blank" rel="noopener">

    <p><strong>Grupo Excellence</strong> © 2026 · Todos os direitos reservados</p>
  </div>

<div class="toast" id="toast">Chave Pix copiada!</div>

<script>
  const pixBtn = document.getElementById('pix-btn');
  const toast = document.getElementById('toast');
  let toastTimer;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  pixBtn.addEventListener('click', async () => {
    const key = pixBtn.getAttribute('data-pix');
    try{
      await navigator.clipboard.writeText(key);
      showToast('Chave Pix copiada!');
    }catch(err){
      showToast('Chave Pix: ' + key);
    }
  });
</script>
